				<div id="veil-status">加载中</div>
				<div class="bar"><div id="veil-bar"></div></div>
				<div class="tag-wrap">
					<svg class="string" viewBox="0 0 60 70" aria-hidden="true"><path d="M8 2 C 20 20, 30 34, 34 66" fill="none" stroke="#b8a88a" stroke-width="1.6" stroke-linecap="round"/></svg>
					<div id="veil-play" class="tag linen">点击开始</div>
				</div>
				<div class="best" id="veil-best"></div>
				<div class="keys felt">
					<kbd>WASD</kbd> 移动 &nbsp; <kbd>Mouse</kbd> 瞄准 &nbsp; <kbd>LMB</kbd> 开火 &nbsp; <kbd>RMB</kbd> 机瞄<br />
					<kbd>R</kbd> 装填 &nbsp; <kbd>E</kbd> 长按购买 / 修复 &nbsp; <kbd>V</kbd> 或 <kbd>MMB</kbd> 刀具 &nbsp; <kbd>G</kbd> 手雷 &nbsp; <kbd>Q</kbd> 切换<br />
					<kbd>Shift</kbd> 冲刺 &nbsp; <kbd>C</kbd> 蹲下 &nbsp; <kbd>Space</kbd> 跳跃 &nbsp; <kbd>M</kbd> 静音 &nbsp; <kbd>Esc</kbd> 暂停 &nbsp; 也支持手柄
				</div>
			</div>
		</div>
