<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<meta name="apple-mobile-web-app-capable" content="yes">
<title>暮线</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#170d2b;color:#fff;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  touch-action:none;overscroll-behavior:none}
body{position:fixed;top:0;left:0;right:0;bottom:0}
#gl,.fill{position:absolute;top:0;left:0;width:100%;height:100%}
#gl{display:block;touch-action:none}
.fill{pointer-events:none}
#vig{background:radial-gradient(ellipse at 50% 55%,rgba(0,0,0,0) 52%,rgba(14,4,30,.6) 100%)}
#danger{background:radial-gradient(ellipse at 50% 50%,rgba(255,40,50,0) 38%,rgba(255,30,45,.62) 100%);opacity:0}
#flash{background:#fff;opacity:0}

#hud{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;opacity:0;transition:opacity .25s;
  padding:12px 14px;
  padding:calc(12px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}
#hud.on{opacity:1}
#hudIn{position:relative;width:100%;height:100%}
.lbl{font-size:11px;letter-spacing:.18em;font-weight:700;text-transform:uppercase;color:rgba(255,236,214,.8)}
.num{font-weight:800;font-style:italic;font-variant-numeric:tabular-nums;line-height:1;
  text-shadow:0 2px 0 rgba(45,12,55,.6),0 0 18px rgba(255,150,60,.35)}
#hudL{position:absolute;top:0;left:0}
#score{font-size:44px;margin-top:2px}
#hudR{position:absolute;top:0;right:0;text-align:right}
#sparkRow{display:flex;align-items:center;justify-content:flex-end;font-size:30px;margin-bottom:5px;transform-origin:100% 50%}
#sparkRow.pop{animation:pop .18s ease-out}
.gem{display:inline-block;width:15px;height:15px;margin-right:9px;background:#ffd84a;transform:rotate(45deg) scale(.85,1.15);
  box-shadow:0 0 12px #ffb020,0 0 3px #fff inset}
#btns{position:absolute;top:0;left:50%;transform:translateX(-50%);display:flex}
#btns button{pointer-events:auto;width:38px;height:38px;margin:0 5px;border-radius:50%;border:1px solid rgba(255,255,255,.25);
  background:rgba(30,14,48,.5);color:#fff;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
#btns svg{width:16px;height:16px;fill:#fff}
#btnMute.off{opacity:.45}
#warn{position:absolute;top:58px;left:50%;transform:translateX(-50%);text-align:center;opacity:0;transition:opacity .15s;
  padding:7px 14px 8px;border-radius:10px;background:rgba(120,10,25,.6);border:1px solid rgba(255,90,90,.7);white-space:nowrap}
#warn.on{opacity:1;animation:pulse .45s ease-in-out infinite alternate}
#warn .lbl{color:#ffd9d6}
.bar{height:5px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;width:100%;background:#fff;transform-origin:0 50%}
#warnBar{background:#ff5a52}
#pw{position:absolute;left:0;right:0;bottom:6px;display:flex;justify-content:center}
.pill{display:none;margin:0 5px;padding:7px 14px 8px;min-width:104px;border-radius:12px;text-align:center;
  font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;background:rgba(30,14,48,.6)}
.pill.on{display:block}
#pwMag{border:1px solid #ff6ad5;color:#ffc4ee}
#magBar{background:#ff6ad5}
#pwShd{border:1px solid #5fe6ff;color:#c9f6ff;box-shadow:0 0 14px rgba(95,230,255,.35) inset}
#toast{position:absolute;left:0;right:0;top:27%;text-align:center;font-size:19px;font-weight:800;font-style:italic;letter-spacing:.07em;
  text-transform:uppercase;opacity:0;text-shadow:0 2px 0 rgba(45,12,55,.7),0 0 16px rgba(255,160,70,.5)}
#toast.show{animation:toast 1.5s ease-out forwards}

.ov{position:absolute;top:0;left:0;right:0;bottom:0;display:none;align-items:center;justify-content:center;text-align:center;
  padding:20px;background:rgba(18,7,34,.42);cursor:pointer}
.ov.on{display:flex}
#over.on{animation:fadein .25s ease-out}
.card{max-width:520px;width:100%}
.kicker{font-size:12px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:#ffc98a}
h1,h2{margin:6px 0 8px;font-weight:900;font-style:italic;letter-spacing:.02em;line-height:.95;
  text-shadow:0 4px 0 rgba(60,14,60,.7),0 0 34px rgba(255,140,60,.55)}
h1{font-size:76px;font-size:clamp(46px,13vw,92px)}
h2{font-size:58px;font-size:clamp(40px,11vw,70px)}
.sub{margin:0 auto 18px;max-width:400px;font-size:15px;line-height:1.45;color:rgba(255,238,226,.86)}
.keys{display:flex;justify-content:center;margin-bottom:10px}
.keys div{margin:0 7px;padding:9px 12px;min-width:88px;border-radius:12px;background:rgba(30,14,48,.55);border:1px solid rgba(255,255,255,.16)}
.keys b{display:block;font-size:20px;line-height:1.1}
.keys span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,236,214,.8)}
.hint{margin:10px 0 0;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,236,214,.7)}
.cta{margin-top:18px;padding:14px 34px;border:0;border-radius:999px;font:inherit;font-size:17px;font-weight:900;font-style:italic;
  letter-spacing:.12em;text-transform:uppercase;color:#2a0d2c;background:linear-gradient(180deg,#ffd76a,#ff9a3c);
  box-shadow:0 5px 0 #a8431c,0 10px 26px rgba(255,130,50,.45);cursor:pointer}
#new最高分{display:none;margin:2px auto 8px;padding:5px 14px;width:max-content;max-width:100%;border-radius:999px;font-size:13px;font-weight:900;
  letter-spacing:.2em;text-transform:uppercase;color:#2a0d2c;background:#5fe6ff;box-shadow:0 0 22px rgba(95,230,255,.7)}
#new最高分.on{display:block;animation:pulse .5s ease-in-out infinite alternate}
#o得分{display:block;font-size:66px;font-size:clamp(46px,14vw,78px);margin:4px 0 14px}
.stats{display:flex;justify-content:center;flex-wrap:wrap}
.stats div{margin:3px 5px;padding:8px 12px;min-width:92px;border-radius:12px;background:rgba(30,14,48,.55);border:1px solid rgba(255,255,255,.14)}
.stats .num{display:block;font-size:21px;margin-top:5px}
#err{display:none;position:absolute;left:8px;right:8px;bottom:8px;padding:8px 10px;border-radius:8px;background:rgba(90,0,10,.9);
  font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;max-height:45%;overflow:auto;-webkit-user-select:text;user-select:text}
@keyframes pop{0%{transform:scale(1.28)}100%{transform:scale(1)}}
@keyframes pulse{0%{transform:translateX(-50%) scale(1)}100%{transform:translateX(-50%) scale(1.05)}}
#new最高分.on{animation-name:pulse2}
@keyframes pulse2{0%{transform:scale(1)}100%{transform:scale(1.07)}}
@keyframes toast{0%{opacity:0;transform:translateY(14px) scale(.9)}12%{opacity:1;transform:translateY(0) scale(1.05)}70%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}
@keyframes fadein{0%{opacity:0}100%{opacity:1}}
@media (max-height:480px){
  h1{font-size:50px}h2{font-size:40px}.sub{display:none}#o得分{font-size:44px;margin-bottom:8px}.cta{margin-top:10px;padding:10px 26px}
  #score{font-size:32px}#sparkRow{font-size:24px}
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="vig" class="fill"></div>
<div id="danger" class="fill"></div>
<div id="flash" class="fill"></div>

<div id="hud"><div id="hudIn">

  <div id="hudR">

    <div class="lbl">最高分 <span id="best">0</span></div>
  </div>
  <div id="btns">
    <button id="btnPause" type="button" aria-label="Pause"><svg viewBox="0 0 16 16"><rect x="3" y="2" width="4" height="12"/><rect x="9" y="2" width="4" height="12"/></svg></button>
    <button id="btnMute" type="button" aria-label="Sound on or off"><svg viewBox="0 0 16 16"><path d="M2 6h3l4-3v10l-4-3H2z"/><path d="M11 5.2c1.4 1.5 1.4 4.1 0 5.6l1 1c2-2.1 2-5.5 0-7.6z"/></svg></button>
  </div>
  <div id="warn"><div class="lbl">清扫车正在逼近</div><div class="bar"><i id="warnBar"></i></div></div>
  <div id="toast"></div>
  <div id="pw">
    <div id="pwMag" class="pill">磁铁<div class="bar"><i id="magBar"></i></div></div>
    <div id="pwShd" class="pill">护盾</div>
  </div>
</div></div>

<div id="menu" class="ov on"><div class="card">
  <div class="kicker">高架线路 · 黄昏班次</div>
  <h1>暮线</h1>
  <p class="sub">You are a small maintenance robot. The sweeper drone wants you off its tracks. Run.</p>
  <div class="keys">
    <div><b>&larr; &rarr;</b><span>变道</span></div>
    <div><b>&uarr;</b><span>跳跃</span></div>
    <div><b>&darr;</b><span>滑铲</span></div>
  </div>
  <p class="hint">方向键或 WASD · 触屏可滑动</p>
  <button id="btnStart" class="cta" type="button">开始游戏</button>
  <p class="hint">最高分 <span id="menu最高分">0</span></p>
</div></div>

<div id="over" class="ov"><div class="card">
  <div class="kicker">你被清扫车抓住了</div>
  <h2>CAUGHT</h2>
  <div id="new最高分">New best</div>
  <div class="lbl">得分</div>
  <span id="o得分" class="num">0</span>
  <div class="stats">
    <div><span class="lbl">Sparks</span><span id="oSparks" class="num">0</span></div>
    <div><span class="lbl">Distance</span><span id="oDist" class="num">0 m</span></div>
    <div><span class="lbl">Time</span><span id="oTime" class="num">0:00</span></div>
    <div><span class="lbl">最高分</span><span id="o最高分" class="num">0</span></div>
  </div>
  <button id="btnAgain" class="cta" type="button">Run again</button>
  <p class="hint">Space, Enter or tap</p>
</div></div>

<div id="pause" class="ov"><div class="card">
  <h2>PAUSED</h2>
  <button id="btnResume" class="cta" type="button">Resume</button>
  <p class="hint">P or Esc</p>
</div></div>

<div id="err"></div>
<noscript><div style="position:absolute;top:40%;left:0;right:0;text-align:center">This game needs JavaScript.</div></noscript>

<script>
(function () {

/* ============================== helpers ============================== */

/* ============================== state ============================== */
var G = {
  mode: 'menu', paused: false, time: 0, realT: 0, speed: 11, baseSpeed: 11, speedMul: 1,
  s0: 0, dist: 0, score: 0, sparks: 0, best: 0, new最高分: false,
  magnet: 0, shield: false, deadT: 0, combo: 0, comboT: 0, overShown: false, cell: 0,
  seed: 1, rng: new Rng(1), p: null, drone: null, obs: [], sp: [], items: [], parts: [], gen: null
};
var fx = { shake: 0, flash: 0, hitstop: 0, danger: 0, fovKick: 0 };

function newPlayer(s) {
  return {
    s: s, x: 0, vx: 0, vxS: 0, lane: 1, prev变道: 1, laneT: 9, y: 0, vy: 0, grounded: true, coyote: 0,
    slide: 0, buf跳跃: 0, buf滑铲: 0, inv: 0, shove: 0, phase: 0, stepSide: 0, squash: 0, tumble: 0,
    camY: 0, lastGY: 0, supY: 0, slideA: 0, airA: 0, deadLift: 0
  };
}
function newDrone() {
  return { close: 0, gap: 3.4, intro: 1.8, x: 0, y: 4.2, roll: 0, beep: 0, beepAlt: 0 };
}
G.p = newPlayer(0);
G.drone = newDrone();
G.drone.gap = 14; G.drone.intro = 0;

function speedAt(t) { return 14 + 23 * (1 - Math.exp(-t / 110)) + 0.04 * t; }

function load最高分() {
  try {
    var v = parseInt(window.localStorage.getItem('duskline.best') || '0', 10);
    G.best = isFinite(v) && v > 0 ? v : 0;
  } catch (e) { G.best = 0; }
}
function save最高分() {
  try { window.localStorage.setItem('duskline.best', String(G.best)); } catch (e) {}
}

/* ============================== audio ============================== */
var AU = { ctx: null, ok: false, failed: false, muted: false, nextStep: 0, step: 0 };

function auInit() {
  if (AU.failed) return;

    if (AU.ctx.state === 'suspended' && !G.paused && !document.hidden) { try { AU.ctx.resume(); } catch (e) {} }

    AU.comp.connect(c.destination);
    AU.sfx = c.createGain();

    var len = Math.floor(c.sampleRate * 1.5), b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0), i;

    AU.windF = c.createBiquadFilter();

    AU.windG = c.createGain();
    AU.windG.gain.value = 0;
    ws.connect(AU.windF); AU.windF.connect(AU.windG); AU.windG.connect(AU.sfx);
    ws.start();

    var o1 = c.createOscillator(), o2 = c.createOscillator(), lfo = c.createOscillator(), lg = c.createGain();
    o1.type = 'sawtooth'; o1.frequency.value = 58;
    o2.type = 'sawtooth'; o2.frequency.value = 87.6;
    AU.humF = c.createBiquadFilter();
    AU.humF.type = 'lowpass'; AU.humF.frequency.value = 420;
    AU.humG = c.createGain();
    AU.humG.gain.value = 0;
    lfo.frequency.value = 9; lg.gain.value = 160;
    lfo.connect(lg); lg.connect(AU.humF.frequency);
    o1.connect(AU.humF); o2.connect(AU.humF); AU.humF.connect(AU.humG); AU.humG.connect(AU.sfx);

    AU.failed = true; AU.ok = false; AU.ctx = null;
  }

function tone(type, f0, f1, dur, vol, at, dest) {
  var c = AU.ctx, t = at || c.currentTime, o = c.createOscillator(), g = c.createGain();

  f.type = ftype; f.Q.value = q;

  g.gain.linearRampToValueAtTime(vol, t + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

var SCALE = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];

  spark: function (n) {

  jump: function () { tone('square', 220, 560, 0.16, 0.06); tone('sine', 330, 760, 0.18, 0.10); },
  land: function () { tone('sine', 120, 55, 0.10, 0.25); noise('lowpass', 900, 300, 0.7, 0.07, 0.12); },
  slide: function () { noise('bandpass', 2400, 500, 1.2, 0.5, 0.18); tone('sawtooth', 140, 70, 0.4, 0.05); },
  lane: function () { noise('bandpass', 700, 1900, 1.5, 0.09, 0.10); },

    tone('square', 311, 150, 0.12, 0.12);
    tone('square', 466, 233, 0.10, 0.08);
  },
  smash: function () { noise('highpass', 1200, 500, 0.6, 0.2, 0.25); tone('triangle', 200, 90, 0.12, 0.15); },
  shieldUp: function () {

    tone('sine', 784, 784, 0.20, 0.14, t + 0.14);
