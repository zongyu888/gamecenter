                }).join("")}
              </div>
              <div class="track-toggles-wrap" id="talks-track-toggles">
                ${DATA.tracks.map(t => {
                  const pressed = state.talksFilter.tracks.includes(t.id);
                  return `<button type="button" class="chip-toggle t-small" data-track="${esc(t.id)}" aria-pressed="${pressed ? "true" : "false"}">
                    <svg width="10" height="10" viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true"><rect x="0" y="0" width="10" height="10" fill="${DATA.tokens.ink}"/><rect x="1" y="1" width="8" height="8" fill="${t.chipBg}"/></svg>
                    (${esc(t.label)})
                  </button>`;
                }).join("")}
              </div>
            </div>
            <p class="t-micro" id="talks-count" aria-live="polite"></p>
          </div>
          <div class="col-full" id="talks-table-wrap"></div>
        </div>
      </section>
    `;

    const searchInput = document.getElementById("talks-search");
    const typeBtns = Array.from(document.querySelectorAll("#talks-type-toggles .chip-toggle"));
    const trackBtns = Array.from(document.querySelectorAll("#talks-track-toggles .chip-toggle"));
    const countEl = document.getElementById("talks-count");
    const wrapEl = document.getElementById("talks-table-wrap");

    function highlightText(text, query) {
      if (!query) return esc(text);
      const normQ = normText(query.trim());
      if (!normQ) return esc(text);
      const normStr = normText(text);
      // Match indices on normalized string (note: length matches for standard latin diacritics)
      let out = "";
      let pos = 0;
      const rawChars = Array.from(text);
      const normChars = rawChars.map(c => normText(c));
      const flatNorm = normChars.join("");
      let idx = flatNorm.indexOf(normQ);
      if (idx === -1) return esc(text);
      // Map char offsets back safely
      const mapStart = [];
      let acc = 0;
      for (let i = 0; i < rawChars.length; i++) {
        for (let k = 0; k < normChars[i].length; k++) mapStart.push(i);
        acc += normChars[i].length;
      }
      mapStart.push(rawChars.length);
      while (idx !== -1) {
        const rawS = mapStart[idx];
        const rawE = mapStart[idx + normQ.length];
        out += esc(rawChars.slice(pos, rawS).join(""));
        out += `<mark>${esc(rawChars.slice(rawS, rawE).join(""))}</mark>`;
        pos = rawE;
        idx = flatNorm.indexOf(normQ, idx + normQ.length);
      }
      out += esc(rawChars.slice(pos).join(""));
      return out;
    }

    function renderTable() {
      const q = normText(state.talksFilter.query.trim());
      let list = DATA.sessions.filter(s => {
        if (state.talksFilter.types.length > 0 && !state.talksFilter.types.includes(s.type)) return false;
        if (state.talksFilter.tracks.length > 0 && !state.talksFilter.tracks.includes(s.track)) return false;
        if (q) {
          const spkNames = s.speakers.map(id => speakerById(id).name).join(" ");
          const hay = normText(`${s.title} ${s.abstract} ${spkNames}`);
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      const dir = state.talksFilter.sortDir === "asc" ? 1 : -1;
      const col = state.talksFilter.sortCol;
      list.sort((a, b) => {
        if (col === "id") return a.id.localeCompare(b.id) * dir;
        if (col === "title") return a.title.localeCompare(b.title) * dir;
        const da = Number(a.day[1]) * 10000 + timeToMin(a.start);
        const db = Number(b.day[1]) * 10000 + timeToMin(b.start);
        return (da - db) * dir;
      });

      countEl.textContent = `${list.length} of ${DATA.sessions.length} sessions`;

      if (list.length === 0) {
        wrapEl.innerHTML = `
          <div class="schedule-empty">
            <p class="t-lead">No session matches “${esc(state.talksFilter.query)}”.</p>
            <button type="button" class="btn-text t-small u-anim" id="talks-clear-btn">(Clear search)</button>
          </div>
        `;
        document.getElementById("talks-clear-btn").addEventListener("click", () => {
          state.talksFilter.query = "";
          state.talksFilter.types = [];
          state.talksFilter.tracks = [];
          searchInput.value = "";
          typeBtns.forEach(b => b.setAttribute("aria-pressed", "false"));
          trackBtns.forEach(b => b.setAttribute("aria-pressed", "false"));
          renderTable();
        });
        return;
      }

      const sortCap = col === "id" ? "number" : col === "title" ? "title" : "day and time";
      const triSvg = activeCol => {
        if (state.talksFilter.sortCol !== activeCol) return "";
        const icon = state.talksFilter.sortDir === "asc" ? "tri-up" : "tri-down";
        return `<svg width="10" height="6" viewBox="0 0 5 3" shape-rendering="crispEdges" fill="currentColor" aria-hidden="true">${
          icon === "tri-up"
            ? `<rect x="2" y="0" width="1" height="1"/><rect x="1" y="1" width="3" height="1"/><rect x="0" y="2" width="5" height="1"/>`
            : `<rect x="0" y="0" width="5" height="1"/><rect x="1" y="1" width="3" height="1"/><rect x="2" y="2" width="1" height="1"/>`
        }</svg>`;
      };
      const ariaSort = activeCol => state.talksFilter.sortCol !== activeCol ? "none" : (state.talksFilter.sortDir === "asc" ? "ascending" : "descending");

      wrapEl.innerHTML = `
        <table class="data-table responsive-table talks-table">
          <caption class="t-micro">Sessions, sorted by ${sortCap}</caption>
          <thead>
            <tr>
              <th class="t-micro" aria-sort="${ariaSort("id")}"><button type="button" class="sort-btn t-micro" data-sort="id">№ ${triSvg("id")}</button></th>
              <th class="t-micro" aria-sort="${ariaSort("title")}"><button type="button" class="sort-btn t-micro" data-sort="title">Title ${triSvg("title")}</button></th>
              <th class="t-micro col-speakers">Speakers</th>
              <th class="t-micro">Track</th>
              <th class="t-micro">Type</th>
              <th class="t-micro" aria-sort="${ariaSort("day")}"><button type="button" class="sort-btn t-micro" data-sort="day">Day / Time ${triSvg("day")}</button></th>
              <th class="t-micro">Room</th>
            </tr>
          </thead>
          <tbody>
            ${list.map(s => {
              const d = dayById(s.day);
              const r = roomById(s.room);
              const tr = trackById(s.track);
              const isOpen = state.talksFilter.openId === s.id;
              const spks = s.speakers.map(id => `<a class="u-anim" href="#/speakers/${esc(id)}">${highlightText(speakerById(id).name, state.talksFilter.query)}</a>`).join(", ");
              const added = state.agenda.includes(s.id);
              return `
                <tr class="talk-row" id="talk-row-${esc(s.id)}" data-track="${esc(s.track)}">
                  <td data-label="№" class="t-small tnum">${esc(s.id)}</td>
                  <td data-label="Title" class="t-small fw-600">
                    <button type="button" class="btn-text t-small fw-600 u-anim" data-disc="${esc(s.id)}" aria-expanded="${isOpen ? "true" : "false"}" aria-controls="expand-${esc(s.id)}">${highlightText(s.title, state.talksFilter.query)}</button>
                  </td>
                  <td data-label="Speakers" class="t-small col-speakers">${spks}</td>
                  <td data-label="Track" class="t-small"><span class="track-chip track-chip-${esc(s.track)}">${esc(tr.label)}</span></td>
                  <td data-label="Type" class="t-small">${esc(s.type)}</td>
                  <td data-label="Day / Time" class="t-small tnum">${esc(d.shortLabel)} · ${fmtTime(s.start)}–${fmtTime(s.end)}</td>
                  <td data-label="Room" class="t-small">${esc(r.name)}</td>
                </tr>
                ${isOpen ? `
                  <tr class="talk-expand-row" id="expand-${esc(s.id)}">
                    <td colspan="7">
                      <p class="t-body">${highlightText(s.abstract, state.talksFilter.query)}</p>
                      <div style="margin-top:16px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;">
                        <span class="t-micro">Speakers: ${spks}</span>
                        <button type="button" class="chip-toggle t-micro" data-ag="${esc(s.id)}" aria-pressed="${added ? "true" : "false"}">${added ? "(In agenda)" : "(Add to agenda)"}</button>
                      </div>
                    </td>
                  </tr>
                ` : ""}
              `;
            }).join("")}
          </tbody>
        </table>
      `;

      wrapEl.querySelectorAll("[data-sort]").forEach(btn => {
        btn.addEventListener("click", () => {
          const c = btn.dataset.sort;
          if (state.talksFilter.sortCol === c) {
            state.talksFilter.sortDir = state.talksFilter.sortDir === "asc" ? "desc" : "asc";
          } else {
            state.talksFilter.sortCol = c;
            state.talksFilter.sortDir = "asc";
          }
          renderTable();
        });
      });

      wrapEl.querySelectorAll("[data-disc]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.dataset.disc;
          state.talksFilter.openId = state.talksFilter.openId === id ? null : id;
          renderTable();
          const newBtn = wrapEl.querySelector(`[data-disc="${id}"]`);
          if (newBtn) newBtn.focus();
        });
      });

      wrapEl.querySelectorAll("[data-ag]").forEach(btn => {
        btn.addEventListener("click", () => {
          toggleAgenda(btn.dataset.ag);
          renderTable();
        });
      });
    }

    searchInput.addEventListener("input", () => {
      state.talksFilter.query = searchInput.value;
      renderTable();
    });

    typeBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        const tp = btn.dataset.type;
        const i = state.talksFilter.types.indexOf(tp);
        if (i === -1) state.talksFilter.types.push(tp);
        else state.talksFilter.types.splice(i, 1);
        btn.setAttribute("aria-pressed", i === -1 ? "true" : "false");
        renderTable();
      });
    });

    trackBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        const tid = btn.dataset.track;
        const i = state.talksFilter.tracks.indexOf(tid);
        if (i === -1) state.talksFilter.tracks.push(tid);
        else state.talksFilter.tracks.splice(i, 1);
        btn.setAttribute("aria-pressed", i === -1 ? "true" : "false");
        renderTable();
      });
    });

    renderTable();

    if (sessionId) {
      const targetRow = document.getElementById(`talk-row-${sessionId}`);
      if (targetRow) {
        window.requestAnimationFrame(() => {
          const top = targetRow.getBoundingClientRect().top + window.scrollY - 120;
          window.scrollTo({ top: Math.max(0, top), behavior: "auto" });
        });
      }
    }
  }

        <line x1="0.5" y1="0.5" x2="0.5" y2="23.5" stroke="${DATA.tokens.ink}" stroke-width="0.4"/>
        <line x1="39.5" y1="0.5" x2="39.5" y2="23.5" stroke="${DATA.tokens.ink}" stroke-width="0.4"/>

      btn.addEventListener("focus", () => updatePlan(rid));

    const capCtrl = buildCapacityGrid(document.getElementById("tickets-capacity-wrap"), { withSelection: true, instant: true });
    const totalEl = document.getElementById("tickets-total");
    const reserveBtn = document.getElementById("reserve-btn");
    const daySelect = document.getElementById("day-pass-select");
    const dayErr = document.getElementById("day-pass-error");
    const dialog = document.getElementById("reserve-dialog");
    const dlgBody = document.getElementById("dlg-body");
    const dlgClose = document.getElementById("dlg-close");

    function refreshTotals() {
      let totalCost = 0;
      let totalQty = 0;
      DATA.tickets.forEach(t => {
        const q = state.ticketQty[t.id] || 0;
        totalQty += q;
        totalCost += q * t.price;
        const row = document.querySelector(`.tier-row[data-tier="${t.id}"]`);
        if (row) {
          const out = row.querySelector(".stepper-val");
          if (out) out.textContent = String(q);
          const dec = row.querySelector('[data-step="-1"]');
          const inc = row.querySelector('[data-step="1"]');
          const maxQ = Math.min(4, t.left);
          const setDis = (btn, dis) => {
            if (!btn) return;
            btn.setAttribute("aria-disabled", dis ? "true" : "false");
            const existing = btn.querySelector(".btn-strike");
            if (dis && !existing) btn.insertAdjacentHTML("afterbegin", svgStrike());
            if (!dis && existing) existing.remove();
          };
          setDis(dec, q <= 0);
          setDis(inc, q >= maxQ);
        }
      });

      totalEl.textContent = `€${totalCost}`;
      capCtrl.setSelected(totalQty);
      const isDisabled = totalQty === 0;
      reserveBtn.setAttribute("aria-disabled", isDisabled ? "true" : "false");
      const rStrike = reserveBtn.querySelector(".btn-strike");
      if (isDisabled && !rStrike) reserveBtn.insertAdjacentHTML("afterbegin", svgStrike());
      if (!isDisabled && rStrike) rStrike.remove();
    }

    document.getElementById("tickets-tier-list").addEventListener("click", e => {
      const btn = e.target.closest(".btn-stepper");
      if (!btn || btn.getAttribute("aria-disabled") === "true") return;
      const tid = btn.dataset.tid;
      const delta = Number(btn.dataset.step);
      const tier = DATA.tickets.find(t => t.id === tid);
      const maxQ = Math.min(4, tier.left);
      const cur = state.ticketQty[tid] || 0;
      const next = Math.max(0, Math.min(maxQ, cur + delta));
      state.ticketQty[tid] = next;
      if (tid === "day" && next === 0) {
        state.ticketError = false;
        dayErr.hidden = true;
        daySelect.removeAttribute("aria-invalid");
        daySelect.removeAttribute("aria-describedby");
      }
      refreshTotals();
    });

    daySelect.addEventListener("change", () => {
      state.ticketDay = daySelect.value;
      if (state.ticketDay) {
        state.ticketError = false;
        dayErr.hidden = true;
        daySelect.removeAttribute("aria-invalid");
        daySelect.removeAttribute("aria-describedby");
      }
    });

    reserveBtn.addEventListener("click", () => {
      if (reserveBtn.getAttribute("aria-disabled") === "true") return;
      if ((state.ticketQty.day || 0) > 0 && !state.ticketDay) {
        state.ticketError = true;
        dayErr.hidden = false;
        daySelect.setAttribute("aria-invalid", "true");
        daySelect.setAttribute("aria-describedby", "day-pass-error");
        daySelect.focus();
        return;
      }
      const parts = [];
      DATA.tickets.forEach(t => {
        const q = state.ticketQty[t.id] || 0;
        if (q > 0) {
          let s = `${q} × ${t.name}`;
          if (t.id === "day" && state.ticketDay) {
            s += ` (${dayById(state.ticketDay).label})`;
          }
          parts.push(s);
        }
      });
      dlgBody.textContent = `RASTER/27 does not exist, so no pass was reserved and no payment was taken. Your selection: ${parts.join(", ")}.`;
      if (typeof dialog.showModal === "function") dialog.showModal();
      else dialog.setAttribute("open", "");
      dlgClose.focus();
    });

    dlgClose.addEventListener("click", () => {
      if (typeof dialog.close === "function") dialog.close();
      else dialog.removeAttribute("open");
      reserveBtn.focus();
    });
    dialog.addEventListener("close", () => {
      reserveBtn.focus();
    });

    refreshTotals();
  }

  function renderBadge(main) {
    document.title = "Badge maker" + DATA.copy.siteTitleSuffix;
    main.innerHTML = `
      <section class="sub-sec" data-surface="ink" data-pager="Badge maker">

            <p class="t-body" style="margin-top:16px;">${esc(DATA.copy.badgeLead)}</p>
          </div>
        </div>
        <div class="grid badge-layout">
          <div class="col-1-6">
            <canvas class="badge-editor-canvas" id="badge-canvas" tabindex="0" role="img" aria-label="Badge drawing grid, 16 by 16. Use arrow keys to move, Space to paint."></canvas>
            <p class="t-micro badge-status" id="badge-status" aria-live="polite">Row 1, column 1, paper.</p>
            <div class="palette-group" role="radiogroup" aria-label="Badge colour palette" id="badge-palette">
              ${BADGE_PALETTE.map((c, idx) => `
                <button type="button" class="palette-swatch" role="radio" aria-checked="${idx === 3 ? "true" : "false"}" aria-label="${idx + 1}: ${esc(c.name)}" data-col="${esc(c.id)}" style="background-color:${c.hex};"></button>
              `).join("")}
            </div>
            <div class="badge-tools" id="badge-tools">
              <button type="button" class="chip-toggle t-small" data-tool="pen" aria-pressed="true">(Pen)</button>
              <button type="button" class="chip-toggle t-small" data-tool="erase" aria-pressed="false">(Erase)</button>
              <button type="button" class="chip-toggle t-small" data-tool="fill" aria-pressed="false">(Fill)</button>
              <button type="button" class="chip-toggle t-small" data-tool="mirror" aria-pressed="false">(Mirror)</button>
              <button type="button" class="chip-toggle t-small" id="badge-random">(Random)</button>
              <button type="button" class="chip-toggle t-small" id="badge-clear">(Clear)</button>
              <button type="button" class="chip-toggle t-small" id="badge-undo">(Undo)</button>
            </div>
          </div>
          <div class="col-8-12">
            <figure>
              <svg class="badge-preview-svg" id="badge-preview" viewBox="0 0 320 480" shape-rendering="crispEdges" role="img" aria-label="Badge for ${esc(state.badge.name)}"></svg>
              <figcaption class="t-micro" style="margin-top:8px;">(Preview: 320 × 480 printable SVG badge.)</figcaption>
            </figure>
            <div class="field-group badge-name-field">
              <label class="t-micro" for="badge-name-input">Name on badge</label>
              <input class="text-input" type="text" id="badge-name-input" maxlength="18" value="${esc(state.badge.name)}">
            </div>
            <div class="badge-dl-wrap">
              <button type="button" class="btn-primary t-small" id="badge-dl-btn"><span>(Download SVG)</span></button>
            </div>
          </div>
        </div>
      </section>
    `;

    const canvas = document.getElementById("badge-canvas");
    const statusEl = document.getElementById("badge-status");
    const previewSvg = document.getElementById("badge-preview");
    const nameInput = document.getElementById("badge-name-input");
    const paletteBtns = Array.from(document.querySelectorAll("#badge-palette .palette-swatch"));
    const toolBtns = Array.from(document.querySelectorAll("#badge-tools [data-tool]"));

    let grid = state.badge.grid.split("");
    const history = [];
    let currentColor = "3"; // blue
    let mode = "pen"; // pen | erase | fill
    let mirror = false;
    let keyR = 0, keyC = 0;
    let canvasFocused = false;
    let painting = false;
    let paintModeOverride = null;

    function pushHistory() {
      history.push(grid.join(""));
      if (history.length > 20) history.shift();
    }

    function saveGrid() {
      state.badge.grid = grid.join("");
      storageSet("raster27.badge", state.badge);
    }

    function drawEditor() {
      const rect = canvas.getBoundingClientRect();
      const maxPx = Math.min(rect.width || 320, 640);
      const cell = Math.max(12, Math.floor(maxPx / 16));
      const size = cell * 16;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      if (canvas.width !== Math.round(size * dpr)) {
        canvas.width = Math.round(size * dpr);
        canvas.height = Math.round(size * dpr);
      }
      const ctx = canvas.getContext("2d");
      if (!ctx) return;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = DATA.tokens.ink;
      ctx.fillRect(0, 0, size, size);

      for (let r = 0; r < 16; r++) {
        for (let c = 0; c < 16; c++) {
          const palId = grid[r * 16 + c];
          const palObj = BADGE_PALETTE[Number(palId)] || BADGE_PALETTE[1];
          ctx.fillStyle = palObj.hex;
          ctx.fillRect(c * cell + 1, r * cell + 1, cell - 1, cell - 1);
        }
      }

      if (canvasFocused) {
        ctx.strokeStyle = DATA.tokens.sodium;
        ctx.lineWidth = 2;
        ctx.strokeRect(keyC * cell + 2, keyR * cell + 2, cell - 4, cell - 4);
      }
    }

    function updateStatus() {
      const palId = grid[keyR * 16 + keyC];
      const palObj = BADGE_PALETTE[Number(palId)] || BADGE_PALETTE[1];
      statusEl.textContent = `Row ${keyR + 1}, column ${keyC + 1}, ${palObj.name}.`;
    }

    function drawPreview() {
      const logoLayout = layoutGlyphLines([DATA.meta.name], 2);
      let logoRects = "";
      const lCellH = 2.4;
      const lCellW = lCellH * 1.25;
      const lx0 = 16;
      const ly0 = Math.round((48 - 9 * lCellH) / 2);
      for (let i = 0; i < logoLayout.cells.length; i++) {
        const cell = logoLayout.cells[i];
        logoRects += `<rect x="${(lx0 + cell.x * lCellW).toFixed(2)}" y="${(ly0 + cell.y * lCellH).toFixed(2)}" width="${lCellW}" height="${lCellH}" fill="${DATA.tokens.sodium}"/>`;
      }

      const spriteSize = 16 * 15;
      const sx0 = (320 - spriteSize) / 2;
      const sy0 = 68;
      let spriteRects = "";
      for (let r = 0; r < 16; r++) {
        for (let c = 0; c < 16; c++) {
          const palId = grid[r * 16 + c];
          const palObj = BADGE_PALETTE[Number(palId)] || BADGE_PALETTE[1];
          spriteRects += `<rect x="${sx0 + c * 15}" y="${sy0 + r * 15}" width="15" height="15" fill="${palObj.hex}"/>`;
        }
      }

      let stripRects = "";
      for (let row = 0; row < 2; row++) {
        for (let i = 0; i < 16; i++) {
          stripRects += `<rect x="${i * 20}" y="${432 + row * 24}" width="20" height="24" fill="${TRAIL_COLORS[(i + row * 3) % TRAIL_COLORS.length]}"/>`;
        }
      }

      const badgeName = state.badge.name || "Your name";
      previewSvg.setAttribute("aria-label", `Badge for ${badgeName}`);
      previewSvg.innerHTML = `
        <rect x="0" y="0" width="320" height="480" fill="${DATA.tokens.sodium}"/>
        <rect x="0" y="0" width="320" height="48" fill="${DATA.tokens.ink}"/>
        ${logoRects}
        ${spriteRects}
        <text x="16" y="356" font-family="Inter Tight, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="${DATA.tokens.ink}">${esc(badgeName)}</text>
        <text x="16" y="388" font-family="Inter Tight, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="${DATA.tokens.ink}">15–17.09.2027 · Dock Hall</text>
        ${stripRects}
      `;
    }

    function paintAt(r, c, colorId) {
      if (r < 0 || r >= 16 || c < 0 || c >= 16) return;
      grid[r * 16 + c] = colorId;
      if (mirror) {
        grid[r * 16 + (15 - c)] = colorId;
      }
    }

    function floodFill(r, c, newCol) {
      const target = grid[r * 16 + c];
      if (target === newCol) return;
      const queue = [[r, c]];
      const seen = new Set();
      while (queue.length > 0) {
        const [cr, cc] = queue.shift();
        const k = cr * 16 + cc;
        if (cr < 0 || cr >= 16 || cc < 0 || cc >= 16 || seen.has(k) || grid[k] !== target) continue;
        seen.add(k);
        grid[k] = newCol;
        queue.push([cr - 1, cc], [cr + 1, cc], [cr, cc - 1], [cr, cc + 1]);
      }
    }

    function coordsFromEvent(e) {
      const rect = canvas.getBoundingClientRect();
      const c = Math.min(15, Math.max(0, Math.floor(((e.clientX - rect.left) / rect.width) * 16)));
      const r = Math.min(15, Math.max(0, Math.floor(((e.clientY - rect.top) / rect.height) * 16)));
      return { r, c };
    }

    canvas.addEventListener("contextmenu", e => e.preventDefault());
    canvas.addEventListener("pointerdown", e => {
      e.preventDefault();
      canvas.focus();
      const { r, c } = coordsFromEvent(e);
      keyR = r; keyC = c;
      pushHistory();
      if (e.button === 2) {
        painting = true;
        paintModeOverride = "1";
        paintAt(r, c, "1");
      } else if (mode === "fill") {
        floodFill(r, c, currentColor);
      } else {
        painting = true;
        paintModeOverride = mode === "erase" ? "1" : currentColor;
        paintAt(r, c, paintModeOverride);
      }
      if (canvas.setPointerCapture) {
        try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
      }
      saveGrid();
      drawEditor();
      drawPreview();
      updateStatus();
    });

    canvas.addEventListener("pointermove", e => {
      if (!painting) return;
      const { r, c } = coordsFromEvent(e);
      keyR = r; keyC = c;
      paintAt(r, c, paintModeOverride);
      saveGrid();
      drawEditor();
      drawPreview();
      updateStatus();
    });

    const stopPaint = () => {
      painting = false;
      paintModeOverride = null;
    };
    canvas.addEventListener("pointerup", stopPaint);
    canvas.addEventListener("pointercancel", stopPaint);

    canvas.addEventListener("focus", () => {
      canvasFocused = true;
      drawEditor();
      updateStatus();
    });
    canvas.addEventListener("blur", () => {
      canvasFocused = false;
      drawEditor();
    });

    canvas.addEventListener("keydown", e => {
      if (e.key === "ArrowRight") { keyC = Math.min(15, keyC + 1); }
      else if (e.key === "ArrowLeft") { keyC = Math.max(0, keyC - 1); }
      else if (e.key === "ArrowDown") { keyR = Math.min(15, keyR + 1); }
      else if (e.key === "ArrowUp") { keyR = Math.max(0, keyR - 1); }
      else if (e.key === " " || e.key === "Enter") {
        e.preventDefault();
        pushHistory();
        if (mode === "fill") floodFill(keyR, keyC, currentColor);
        else paintAt(keyR, keyC, mode === "erase" ? "1" : currentColor);
        saveGrid();
        drawPreview();
      } else if (e.key === "Delete" || e.key === "Backspace") {
        e.preventDefault();
        pushHistory();
        paintAt(keyR, keyC, "1");
        saveGrid();
        drawPreview();
      } else if (e.key >= "1" && e.key <= "9") {
        selectColor(String(Number(e.key) - 1));
      } else {
        return;
      }
      e.preventDefault();
      drawEditor();
      updateStatus();
    });

    function selectColor(colId) {
      currentColor = colId;
      paletteBtns.forEach(b => b.setAttribute("aria-checked", b.dataset.col === colId ? "true" : "false"));
    }

    paletteBtns.forEach((btn, idx) => {
      btn.addEventListener("click", () => selectColor(btn.dataset.col));
      btn.addEventListener("keydown", e => {
        let next = -1;
        if (e.key === "ArrowRight" || e.key === "ArrowDown") next = (idx + 1) % paletteBtns.length;
        else if (e.key === "ArrowLeft" || e.key === "ArrowUp") next = (idx - 1 + paletteBtns.length) % paletteBtns.length;
        if (next >= 0) {
          e.preventDefault();
          selectColor(paletteBtns[next].dataset.col);
          paletteBtns[next].focus();
        }
      });
    });

    toolBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        const t = btn.dataset.tool;
        if (t === "mirror") {
          mirror = !mirror;
          btn.setAttribute("aria-pressed", mirror ? "true" : "false");
          return;
        }
        mode = t;
        toolBtns.forEach(b => {
          if (b.dataset.tool !== "mirror") {
            b.setAttribute("aria-pressed", b.dataset.tool === mode ? "true" : "false");
          }
        });
      });
    });

    document.getElementById("badge-random").addEventListener("click", () => {
      pushHistory();
      const rng = makeRng(Date.now());
      const accent = String(3 + Math.floor(rng() * 6));
      const g = new Array(256).fill("1");
      for (let r = 2; r <= 13; r++) {
        for (let c = 0; c < 8; c++) {
          if (rng() < 0.42) {
            g[r * 16 + c] = accent;
            g[r * 16 + (15 - c)] = accent;
          }
        }
      }
      const eyeC = 3 + Math.floor(rng() * 4);
      g[6 * 16 + eyeC] = "0";
      g[6 * 16 + (15 - eyeC)] = "0";
      grid = g;
      saveGrid();
      drawEditor();
      drawPreview();
      updateStatus();
    });

    document.getElementById("badge-clear").addEventListener("click", () => {
      pushHistory();
      grid = new Array(256).fill("1");
      saveGrid();
      drawEditor();
      drawPreview();
      updateStatus();
    });

    const doUndo = () => {
      if (history.length === 0) return;
      grid = history.pop().split("");
      saveGrid();
      drawEditor();
      drawPreview();
      updateStatus();
    };
    document.getElementById("badge-undo").addEventListener("click", doUndo);

    const onKeyUndo = e => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") {
        e.preventDefault();
        doUndo();
      }
    };
    document.addEventListener("keydown", onKeyUndo);

    nameInput.addEventListener("input", () => {
      state.badge.name = nameInput.value.slice(0, 18);
      storageSet("raster27.badge", state.badge);
      drawPreview();
    });

    document.getElementById("badge-dl-btn").addEventListener("click", () => {
      const ser = new XMLSerializer();
      const clone = previewSvg.cloneNode(true);
      clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
      clone.setAttribute("width", "320");
      clone.setAttribute("height", "480");
      const svgText = `<?xml version="1.0" encoding="UTF-8"?>\n` + ser.serializeToString(clone);
      const blob = new Blob([svgText], { type: "image/svg+xml;charset=utf-8" });
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = blobUrl;
      a.download = "raster27-badge.svg";
      document.body.appendChild(a);
      a.click();
      a.remove();
      window.setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
    });

    const ro = new ResizeObserver(drawEditor);
    ro.observe(canvas);
    state.routeCleanup.push(() => {
      ro.disconnect();
      document.removeEventListener("keydown", onKeyUndo);
    });

    drawEditor();
    drawPreview();
    updateStatus();
  }

  function renderNotFound(main) {

  // Hash Router
  let currentRouteKey = null;

  function parseRoute(hash) {
    const clean = (hash || "#/").replace(/^#/, "");
    if (clean === "" || clean === "/") return { view: "home", key: "home" };
    const parts = clean.split("/").filter(Boolean);
    if (parts[0] === "schedule" && parts.length === 1) return { view: "schedule", key: "schedule" };
    if (parts[0] === "speakers" && parts.length === 1) return { view: "speakers", key: "speakers" };
    if (parts[0] === "speakers" && parts.length === 2) return { view: "speaker", param: parts[1], key: "speaker:" + parts[1] };
    if (parts[0] === "talks" && parts.length === 1) return { view: "talks", key: "talks" };
    if (parts[0] === "talks" && parts.length === 2) return { view: "talks", param: parts[1], key: "talks:" + parts[1] };
    if (parts[0] === "venue" && parts.length === 1) return { view: "venue", key: "venue" };
    if (parts[0] === "tickets" && parts.length === 1) return { view: "tickets", key: "tickets" };
    if (parts[0] === "badge" && parts.length === 1) return { view: "badge", key: "badge" };
    return { view: "404", key: "404" };
  }

  function updateActiveNav(route) {
    const mapHref = {
      schedule: "#/schedule",
      speakers: "#/speakers",
      speaker: "#/speakers",
      talks: "#/talks",
      venue: "#/venue",
      tickets: "#/tickets",
      badge: "#/badge"
    }[route.view] || "";
    document.querySelectorAll("#header-nav a, #menu-nav a").forEach(a => {
      if (a.getAttribute("href") === mapHref) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    });
  }

  function mountRoute(route, skipWipe) {
    const main = document.getElementById("main");
    const doSwap = () => {
      while (state.routeCleanup.length > 0) {
        const fn = state.routeCleanup.pop();
        try { fn(); } catch (e) {}
      }
      hideTip();

      if (route.view === "home") renderHome(main);
      else if (route.view === "schedule") renderSchedule(main);
      else if (route.view === "speakers") renderSpeakers(main);
      else if (route.view === "speaker") renderSpeakerDetail(main, route.param);
      else if (route.view === "talks") renderTalks(main, route.param);
      else if (route.view === "venue") renderVenue(main);
      else if (route.view === "tickets") renderTickets(main);
      else if (route.view === "badge") renderBadge(main);
      else renderNotFound(main);

      updateActiveNav(route);
      setupObservers();

      if (state.scrollAfterRoute) {
        const target = document.getElementById(state.scrollAfterRoute);
        state.scrollAfterRoute = null;
        if (target) target.scrollIntoView({ behavior: state.motionOn ? "smooth" : "auto" });
      } else if (!(route.view === "talks" && route.param)) {
        window.scrollTo(0, 0);
      }

      if (!skipWipe) {
        const h1 = main.querySelector("h1");
        if (h1) h1.focus({ preventScroll: true });
      }
    };

    if (skipWipe) doSwap();
    else playWipe(doSwap);
  }

  function init() {
    initChrome();
    initTrail();
    const initial = parseRoute(window.location.hash);
    currentRouteKey = initial.key;
    mountRoute(initial, true);

    window.addEventListener("hashchange", () => {
      const next = parseRoute(window.location.hash);
      if (next.key === currentRouteKey) return;
      currentRouteKey = next.key;
      mountRoute(next, false);
    });
  }

  return { init };
})();

document.addEventListener("DOMContentLoaded", () => APP.init());
</script>
</body>
</html>
